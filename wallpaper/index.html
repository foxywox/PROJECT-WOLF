<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WOLF Ember Forest</title>
<!--
  WOLF Ember Forest: a live desktop wallpaper (Wallpaper Engine web wallpaper, or any browser).
  An autumn forest at golden hour. A wolf sits on a rock by the water, made of facets, one group
  per item of WOLF's production plan: finished items glow in warm fur tones, the item being
  built pulses, and the rest is still a dark silhouette. Data comes straight from the public
  GitHub repo (hub/plan.json, hub/progress.json), so the wolf changes as WOLF is built, with no
  server running on this computer. The scene is drawn in code: no image files.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@100;300;400&display=swap">
<style>
  :root {
    --ink: #f0663e;
    --ink-soft: rgba(240, 102, 62, .78);
    --glow: rgba(255, 140, 70, .35);
    --thin: "Josefin Sans", "Segoe UI Light", "Segoe UI", system-ui, sans-serif;
    color-scheme: dark;
  }
  html, body { margin: 0; height: 100%; background: #12070a; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  .clock {
    position: fixed; left: 9vw; top: 37vh; color: var(--ink); font-family: var(--thin);
    text-align: center; text-shadow: 0 0 2.2vh var(--glow); user-select: none; pointer-events: none;
  }
  .day { font-weight: 300; font-size: 11.5vh; letter-spacing: 3.2vh; line-height: 1; margin-right: -3.2vh; }
  .date { font-weight: 300; font-size: 2.9vh; letter-spacing: .5vh; margin-top: 2.4vh; }
  .time { font-weight: 300; font-size: 2.9vh; letter-spacing: .5vh; margin-top: .6vh; }
  .wolf-line { font-weight: 300; font-size: 1.75vh; letter-spacing: .45vh; margin-top: 5.2vh; color: var(--ink-soft); text-transform: uppercase; }
  .wolf-line + .wolf-line { margin-top: .9vh; }
  .hidden { display: none; }
</style>
</head>
<body>
<canvas id="scene" aria-label="WOLF, a wolf assembling itself in an autumn forest"></canvas>
<div class="clock" id="clock">
  <div class="day" id="day">SATURDAY</div>
  <div class="date" id="date"></div>
  <div class="time" id="time"></div>
  <div class="wolf-line" id="wolf-status">WOLF · waking up</div>
  <div class="wolf-line" id="wolf-next"></div>
</div>

<script>
"use strict";
/* ---------- settings (Wallpaper Engine properties override these) ---------- */
const cfg = { repo: "foxywox/PROJECT-WOLF", branch: "", refreshMinutes: 2, hour24: true, particles: 1 };

/* ---------- small helpers ---------- */
const $ = (id) => document.getElementById(id);
const store = { get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
                set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch { /* fine */ } } };
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* ---------- the wolf: a sitting silhouette facing left, cut into facets ---------- */
// Outline in a 100 x 120 box (x right, y down). Facing left, watching the water.
const OUTLINE = [
  [6, 34], [10, 30], [18, 27], [24, 23], [30, 19], [33, 3], [39, 15], [43, 14], [47, 4], [50, 20], [54, 28],
  [60, 40], [70, 54], [82, 66], [90, 80], [94, 96], [100, 101], [110, 96], [121, 103], [112, 110], [98, 113],
  [86, 113], [72, 114], [62, 113], [57, 106], [52, 104], [52, 113], [39, 114], [38, 108], [40, 98], [36, 82],
  [31, 64], [26, 52], [21, 46], [15, 42], [9, 39],
];
// Extra points inside the body so the facets look like low-poly fur rather than slivers.
const INNER = [[20, 34], [28, 30], [36, 24], [44, 24], [36, 38], [48, 40], [30, 46], [42, 54], [56, 56], [34, 72],
  [48, 70], [64, 70], [76, 76], [44, 88], [60, 88], [78, 92], [86, 102], [66, 102], [104, 104], [50, 98]];

function inside(p, poly) {
  let c = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const [xi, yi] = poly[i], [xj, yj] = poly[j];
    if ((yi > p[1]) !== (yj > p[1]) && p[0] < (xj - xi) * (p[1] - yi) / (yj - yi) + xi) c = !c;
  }
  return c;
}
// Bowyer-Watson Delaunay triangulation, keeping only triangles whose centre is inside the outline.
function triangulate(points, outline) {
  const pts = points.concat([[-1000, -1000], [1000, -1000], [0, 1000]]);
  let tris = [[pts.length - 3, pts.length - 2, pts.length - 1]];
  const circ = (t) => {
    const [a, b, c] = t.map((i) => pts[i]);
    const d = 2 * (a[0] * (b[1] - c[1]) + b[0] * (c[1] - a[1]) + c[0] * (a[1] - b[1]));
    const ux = ((a[0] ** 2 + a[1] ** 2) * (b[1] - c[1]) + (b[0] ** 2 + b[1] ** 2) * (c[1] - a[1]) + (c[0] ** 2 + c[1] ** 2) * (a[1] - b[1])) / d;
    const uy = ((a[0] ** 2 + a[1] ** 2) * (c[0] - b[0]) + (b[0] ** 2 + b[1] ** 2) * (a[0] - c[0]) + (c[0] ** 2 + c[1] ** 2) * (b[0] - a[0])) / d;
    return [ux, uy, (a[0] - ux) ** 2 + (a[1] - uy) ** 2];
  };
  for (let i = 0; i < points.length; i++) {
    const p = pts[i];
    const bad = tris.filter((t) => { const [x, y, r] = circ(t); return (p[0] - x) ** 2 + (p[1] - y) ** 2 < r; });
    const edges = [];
    for (const t of bad) for (const e of [[t[0], t[1]], [t[1], t[2]], [t[2], t[0]]]) {
      const k = edges.findIndex((f) => (f[0] === e[1] && f[1] === e[0]) || (f[0] === e[0] && f[1] === e[1]));
      if (k >= 0) edges.splice(k, 1); else edges.push(e);
    }
    tris = tris.filter((t) => !bad.includes(t)).concat(edges.map((e) => [e[0], e[1], i]));
  }
  return tris.filter((t) => t.every((i) => i < points.length))
    .map((t) => t.map((i) => pts[i]))
    .filter((t) => inside([(t[0][0] + t[1][0] + t[2][0]) / 3, (t[0][1] + t[1][1] + t[2][1]) / 3], outline));
}
const FACETS = triangulate(OUTLINE.concat(INNER), OUTLINE)
  .map((pts) => ({ pts, cx: (pts[0][0] + pts[1][0] + pts[2][0]) / 3, cy: (pts[0][1] + pts[1][1] + pts[2][1]) / 3 }))
  .sort((a, b) => a.cy - b.cy || a.cx - b.cx); // assembles from the ears down
FACETS.forEach((f, i) => { f.shade = rng(i * 7919 + 13)(); f.state = "todo"; });
const EYE = [24, 29];

/* ---------- canvas setup ---------- */
const canvas = $("scene"), ctx = canvas.getContext("2d");
let W = 0, H = 0, DPR = 1, backdrop = null, wolfBox = null;
const LIGHT = () => [W * 0.6, H * 0.08];
const HORIZON = () => H * 0.72;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
  const s = H * 0.56 / 120;
  wolfBox = { x: W * 0.6 - 60 * s, y: H * 0.651 - 113 * s, s };
  buildBackdrop();
}

/* ---------- the forest (drawn once per resize/data change, then reused every frame) ---------- */
function buildBackdrop() {
  const off = document.createElement("canvas");
  off.width = canvas.width; off.height = canvas.height;
  const g = off.getContext("2d");
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  const R = rng(20261107);
  const [lx, ly] = LIGHT(), hz = HORIZON();

  // Sky glow
  const grad = g.createRadialGradient(lx, ly, 0, lx, ly, Math.hypot(W, H) * 0.85);
  grad.addColorStop(0, "#fff0c4"); grad.addColorStop(0.08, "#ffc477"); grad.addColorStop(0.24, "#f07a35");
  grad.addColorStop(0.45, "#a8341c"); grad.addColorStop(0.7, "#4a1311"); grad.addColorStop(1, "#14070a");
  g.fillStyle = grad; g.fillRect(0, 0, W, H);

  // Distant trees, soft and warm
  g.filter = `blur(${Math.max(2, W / 500)}px)`;
  for (let i = 0; i < 26; i++) {
    const x = R() * W, w = W * (0.006 + R() * 0.014);
    const dist = Math.abs(x - lx) / W;
    g.fillStyle = `rgba(${70 + dist * 20}, ${22 + dist * 6}, 18, ${0.35 + dist * 0.4})`;
    g.beginPath(); g.moveTo(x - w, hz); g.lineTo(x - w * 0.55, 0); g.lineTo(x + w * 0.55, 0); g.lineTo(x + w, hz); g.fill();
  }
  // Canopy: masses of orange and red leaves, brighter near the light
  g.filter = `blur(${Math.max(4, W / 260)}px)`;
  for (let i = 0; i < 520; i++) {
    const x = R() * W, y = Math.pow(R(), 1.6) * H * 0.62, r = W * (0.01 + R() * 0.035);
    const near = Math.max(0, 1 - Math.hypot(x - lx, y - ly) / (W * 0.55));
    g.fillStyle = `hsla(${8 + R() * 26}, 85%, ${22 + near * 38 + R() * 10}%, ${0.08 + R() * 0.16})`;
    g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
  }
  g.filter = "none";

  // Light shafts
  g.globalCompositeOperation = "lighter";
  for (let i = 0; i < 9; i++) {
    const a = Math.PI * (0.38 + R() * 0.42), spread = 0.025 + R() * 0.05, len = H * 1.4;
    const sg = g.createLinearGradient(lx, ly, lx + Math.cos(a) * len, ly + Math.sin(a) * len);
    sg.addColorStop(0, "rgba(255, 210, 140, .16)"); sg.addColorStop(1, "rgba(255, 140, 60, 0)");
    g.fillStyle = sg;
    g.beginPath(); g.moveTo(lx, ly);
    g.lineTo(lx + Math.cos(a - spread) * len, ly + Math.sin(a - spread) * len);
    g.lineTo(lx + Math.cos(a + spread) * len, ly + Math.sin(a + spread) * len); g.fill();
  }
  g.globalCompositeOperation = "source-over";

  // Near trees: dark trunks and branches framing the scene
  const trunk = (x, w, lean, col) => {
    g.fillStyle = col; g.strokeStyle = col; g.lineCap = "round";
    g.beginPath(); g.moveTo(x - w, hz + 10); g.quadraticCurveTo(x - w * 0.4 + lean * 0.5, H * 0.4, x - w * 0.2 + lean, -10);
    g.lineTo(x + w * 0.2 + lean, -10); g.quadraticCurveTo(x + w * 0.4 + lean * 0.5, H * 0.4, x + w, hz + 10); g.fill();
    for (let b = 0; b < 5; b++) {
      const by = H * (0.06 + R() * 0.38), dir = R() < 0.5 ? -1 : 1, bl = W * (0.05 + R() * 0.12);
      g.lineWidth = w * (0.12 + R() * 0.18);
      g.beginPath(); g.moveTo(x + lean * (1 - by / H), by);
      g.quadraticCurveTo(x + dir * bl * 0.5, by - H * 0.05, x + dir * bl, by - H * (0.02 + R() * 0.1)); g.stroke();
    }
  };
  trunk(W * 0.06, W * 0.035, W * 0.02, "#1c0a0a");
  trunk(W * 0.22, W * 0.012, -W * 0.01, "rgba(40, 14, 12, .85)");
  trunk(W * 0.86, W * 0.03, -W * 0.03, "#1a0909");
  trunk(W * 0.97, W * 0.02, W * 0.01, "#160808");

  // Near foliage: fine leaves gathered in clusters along the top edge
  for (let c = 0; c < 26; c++) {
    const cx = R() * W, cy = Math.pow(R(), 2) * H * 0.26, spread = W * (0.03 + R() * 0.06);
    for (let i = 0; i < 26; i++) {
      const x = cx + (R() - 0.5) * spread * 2, y = cy + (R() - 0.5) * spread, r = W * (0.0025 + R() * 0.004);
      g.fillStyle = `hsla(${4 + R() * 26}, 82%, ${20 + R() * 34}%, ${0.55 + R() * 0.4})`;
      g.beginPath(); g.ellipse(x, y, r * 1.7, r, R() * Math.PI, 0, Math.PI * 2); g.fill();
    }
  }
  for (let i = 0; i < 0; i++) {
    const x = 0, y = 0, r = 0;
    g.beginPath(); g.ellipse(x, y, r * 1.6, r, R() * Math.PI, 0, Math.PI * 2); g.fill();
  }

  // Far bank, and the rock the wolf sits on
  g.fillStyle = "#170909";
  g.beginPath(); g.moveTo(0, hz); g.bezierCurveTo(W * 0.15, hz - H * 0.03, W * 0.3, hz - H * 0.01, W * 0.42, hz);
  g.lineTo(W * 0.42, hz + 2); g.lineTo(0, hz + 2); g.fill();
  const rx = W * 0.6;
  g.fillStyle = "#1b0b0b";
  g.beginPath(); g.moveTo(rx - W * 0.17, hz + 2); g.lineTo(rx - W * 0.13, H * 0.66); g.lineTo(rx - W * 0.05, H * 0.648);
  g.lineTo(rx + W * 0.07, H * 0.652); g.lineTo(rx + W * 0.16, H * 0.675); g.lineTo(rx + W * 0.24, hz + 2); g.fill();
  g.strokeStyle = "rgba(255, 150, 80, .35)"; g.lineWidth = 1.5;
  g.beginPath(); g.moveTo(rx - W * 0.13, H * 0.66); g.lineTo(rx - W * 0.05, H * 0.648); g.lineTo(rx + W * 0.07, H * 0.652); g.stroke();

  drawWolf(g);

  // Water: a darkened, rippled reflection of everything above the horizon
  const hzp = Math.round(hz * DPR);
  g.save(); g.setTransform(1, 0, 0, 1, 0, 0);
  for (let y = hzp; y < off.height; y += 2) {
    const srcY = hzp - (y - hzp) - 1;
    if (srcY < 0) break;
    g.drawImage(off, 0, srcY, off.width, 2, Math.sin(y * 0.09) * 3 * DPR, y, off.width, 2);
  }
  g.restore();
  const wg = g.createLinearGradient(0, hz, 0, H);
  wg.addColorStop(0, "rgba(20, 6, 8, .35)"); wg.addColorStop(1, "rgba(10, 3, 6, .85)");
  g.fillStyle = wg; g.fillRect(0, hz, W, H - hz);
  g.globalCompositeOperation = "lighter";
  for (let i = 0; i < 70; i++) {
    const y = hz + Math.pow(R(), 1.5) * (H - hz), x = R() * W, w = W * (0.02 + R() * 0.08);
    g.strokeStyle = `rgba(255, 160, 90, ${0.04 + R() * 0.08})`; g.lineWidth = 1;
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + w, y); g.stroke();
  }
  g.globalCompositeOperation = "source-over";

  // Vignette
  const vg = g.createRadialGradient(W * 0.5, H * 0.45, Math.min(W, H) * 0.35, W * 0.5, H * 0.5, Math.hypot(W, H) * 0.62);
  vg.addColorStop(0, "rgba(0,0,0,0)"); vg.addColorStop(1, "rgba(8, 2, 4, .78)");
  g.fillStyle = vg; g.fillRect(0, 0, W, H);
  backdrop = off;
}

/* ---------- the wolf ---------- */
function fur(f) {
  // Warm fur: lighter where the light hits (higher up), deeper red-orange lower and behind.
  const lightness = 46 + (1 - f.cy / 120) * 18 + f.shade * 14 - (f.cx > 60 ? 8 : 0);
  const chest = f.cx < 42 && f.cy > 36 && f.cy < 96;
  return chest ? `hsl(32, 70%, ${Math.min(88, lightness + 24)}%)` : `hsl(${16 + f.shade * 10}, 78%, ${lightness}%)`;
}
const wolfPoint = ([px, py]) => [wolfBox.x + px * wolfBox.s, wolfBox.y + py * wolfBox.s];
function facetPath(g, f) {
  const [a, b, c] = f.pts.map(wolfPoint);
  g.beginPath(); g.moveTo(...a); g.lineTo(...b); g.lineTo(...c); g.closePath();
}
function drawWolf(g) {
  // Silhouette first, so unfinished parts read as a dark wolf against the light.
  g.fillStyle = "#130707";
  g.beginPath(); OUTLINE.forEach((p, i) => { const [a, b] = wolfPoint(p); i ? g.lineTo(a, b) : g.moveTo(a, b); }); g.closePath(); g.fill();
  for (const f of FACETS) {
    facetPath(g, f);
    if (f.state === "done") {
      g.fillStyle = fur(f); g.fill();
      g.strokeStyle = "rgba(255, 220, 170, .18)"; g.lineWidth = 0.6; g.stroke();
    } else if (f.state === "active") {
      g.fillStyle = "rgba(255, 170, 80, .3)"; g.fill();
      g.strokeStyle = "rgba(255, 210, 140, .7)"; g.lineWidth = 1; g.stroke();
    } else {
      g.strokeStyle = f.state === "idea" ? "rgba(255, 130, 70, .08)" : "rgba(255, 130, 70, .2)";
      g.lineWidth = 0.7; g.stroke();
    }
  }
  // Rim light along the back of the head and neck, and the eye.
  g.strokeStyle = "rgba(255, 190, 120, .45)"; g.lineWidth = 1.2;
  g.beginPath(); OUTLINE.slice(0, 15).forEach((p, i) => { const [a, b] = wolfPoint(p); i ? g.lineTo(a, b) : g.moveTo(a, b); }); g.stroke();
  const headDone = FACETS.filter((f) => f.cy < 32).every((f) => f.state === "done");
  const [ex, ey] = wolfPoint(EYE);
  g.fillStyle = headDone ? "#2a0d06" : "rgba(255, 170, 90, .9)";
  g.beginPath(); g.ellipse(ex, ey, 1.6 * wolfBox.s, 1 * wolfBox.s, -0.3, 0, Math.PI * 2); g.fill();
}

/* ---------- embers and falling leaves ---------- */
let embers = [], leaves = [];
function seedParticles() {
  const R = rng(Date.now() % 100000);
  embers = Array.from({ length: Math.round(90 * cfg.particles) }, () => ({ x: R() * W, y: R() * H, r: 0.6 + R() * 1.8,
    vx: -0.05 - R() * 0.2, vy: -0.08 - R() * 0.25, tw: R() * 6.28 }));
  leaves = Array.from({ length: Math.round(14 * cfg.particles) }, () => ({ x: R() * W, y: R() * H, s: 3 + R() * 5,
    vx: -0.2 - R() * 0.4, vy: 0.35 + R() * 0.5, a: R() * 6.28, va: (R() - 0.5) * 0.04, hue: 4 + R() * 20 }));
}

/* ---------- animation loop (30 fps; stops while Wallpaper Engine pauses) ---------- */
let paused = false, last = 0, hasActive = false;
function frame(t) {
  if (paused) return;
  requestAnimationFrame(frame);
  if (t - last < 1000 / 30 || !backdrop) return;
  last = t;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(backdrop, 0, 0);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (hasActive) { // the part being built breathes
    const pulse = (Math.sin(t / 700) + 1) / 2;
    for (const f of FACETS) if (f.state === "active") {
      facetPath(ctx, f); ctx.fillStyle = `rgba(255, 170, 80, ${0.1 + pulse * 0.5})`; ctx.fill();
    }
  }
  ctx.globalCompositeOperation = "lighter";
  for (const e of embers) {
    e.x += e.vx; e.y += e.vy; e.tw += 0.05;
    if (e.y < -10 || e.x < -10) { e.y = H + 10; e.x = Math.random() * W * 1.2; }
    ctx.fillStyle = `rgba(255, ${150 + (e.r * 20 | 0)}, 90, ${0.35 + Math.sin(e.tw) * 0.25})`;
    ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalCompositeOperation = "source-over";
  for (const l of leaves) {
    l.x += l.vx + Math.sin(l.a) * 0.3; l.y += l.vy; l.a += l.va;
    if (l.y > H + 20) { l.y = -20; l.x = Math.random() * W * 1.2; }
    ctx.save(); ctx.translate(l.x, l.y); ctx.rotate(l.a);
    ctx.fillStyle = `hsla(${l.hue}, 80%, 42%, .85)`;
    ctx.beginPath(); ctx.ellipse(0, 0, l.s, l.s * 0.45, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();
  }
}

/* ---------- clock, in the style of a desktop clock widget ---------- */
function tick() {
  const d = new Date();
  $("day").textContent = d.toLocaleDateString("en-US", { weekday: "long" }).toUpperCase();
  $("date").textContent = `${d.getDate()} ${d.toLocaleDateString("en-US", { month: "short" }).toUpperCase()} ${d.getFullYear()}`;
  const hh = String(cfg.hour24 ? d.getHours() : d.getHours() % 12 || 12).padStart(2, "0");
  $("time").textContent = `-${hh}:${String(d.getMinutes()).padStart(2, "0")}-`;
}

/* ---------- WOLF's plan and progress, from GitHub ---------- */
function applyPlan(plan, progress) {
  const items = (plan.phases || []).flatMap((p) => p.items || []);
  if (!items.length) return;
  FACETS.forEach((f, t) => {
    const item = items[Math.min(items.length - 1, Math.floor(t * items.length / FACETS.length))];
    f.state = item.status === "done" ? "done" : item.status === "active" ? "active" : item.status === "idea" ? "idea" : "todo";
  });
  hasActive = FACETS.some((f) => f.state === "active");
  const pct = Math.round(100 * items.filter((i) => i.status === "done").length / items.length);
  let status = `WOLF · ${pct}% awake`;
  if (progress && progress.status !== "done" && Number(progress.percent) < 100 && progress.title) status += ` · building: ${progress.title}`;
  $("wolf-status").textContent = status;
  const waiting = items.filter((i) => (i.status === "next" || i.status === "active") && i.who === "human").length;
  $("wolf-next").textContent = waiting ? `${waiting} ${waiting === 1 ? "thing needs" : "things need"} you` : "";
  if (W) buildBackdrop();
}

let branch = "";
async function getJSON(url) { const r = await fetch(url, { cache: "no-store" }); if (!r.ok) throw new Error(String(r.status)); return r.json(); }
async function refresh() {
  if (paused) return;
  try {
    if (!branch) branch = cfg.branch || (await getJSON(`https://api.github.com/repos/${cfg.repo}`)).default_branch;
    const raw = `https://raw.githubusercontent.com/${cfg.repo}/${branch}/hub/`, t = Date.now();
    const [plan, progress] = await Promise.all([getJSON(raw + "plan.json?t=" + t), getJSON(raw + "progress.json?t=" + t).catch(() => null)]);
    store.set("wolf.wp2", { plan, progress });
    applyPlan(plan, progress);
  } catch { /* offline: keep showing the last saved state */ }
}
let refreshTimer = null;
function schedule() { clearInterval(refreshTimer); refreshTimer = setInterval(refresh, Math.max(1, cfg.refreshMinutes) * 60000); }

/* ---------- start ---------- */
window.addEventListener("resize", () => { resize(); seedParticles(); });
resize(); seedParticles(); tick();
setInterval(tick, 1000);
const saved = store.get("wolf.wp2");
if (saved) applyPlan(saved.plan, saved.progress);
refresh(); schedule();
requestAnimationFrame(frame);

/* ---------- Wallpaper Engine integration (ignored in a normal browser) ---------- */
function weColor(v) { const [r, g, b] = String(v).split(" ").map((n) => Math.round(Number(n) * 255)); return `rgb(${r}, ${g}, ${b})`; }
window.wallpaperPropertyListener = {
  applyUserProperties(p) {
    let reload = false;
    if (p.repo && p.repo.value && p.repo.value.trim() !== cfg.repo) { cfg.repo = p.repo.value.trim(); branch = ""; reload = true; }
    if (p.branch && p.branch.value !== undefined && p.branch.value.trim() !== cfg.branch) { cfg.branch = p.branch.value.trim(); branch = ""; reload = true; }
    if (p.refreshminutes) { cfg.refreshMinutes = Number(p.refreshminutes.value) || 2; schedule(); }
    if (p.showclock) $("clock").classList.toggle("hidden", !p.showclock.value);
    if (p.showstatus) for (const id of ["wolf-status", "wolf-next"]) $(id).classList.toggle("hidden", !p.showstatus.value);
    if (p.hour24) { cfg.hour24 = !!p.hour24.value; tick(); }
    if (p.textcolor) document.documentElement.style.setProperty("--ink", weColor(p.textcolor.value));
    if (p.particles) { cfg.particles = Number(p.particles.value) / 100; seedParticles(); }
    if (reload) refresh();
  },
  setPaused(isPaused) {
    paused = isPaused;
    if (!isPaused) { last = 0; requestAnimationFrame(frame); refresh(); }
  },
};
</script>
</body>
