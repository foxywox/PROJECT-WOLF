<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WOLF Blueprint</title>
<!--
  WOLF Blueprint: a live desktop wallpaper (Wallpaper Engine web wallpaper, or any browser).
  The wolf is drawn from triangles, one or more per item of WOLF's production plan:
  done = filled, in progress = glowing, planned = faint outline. Data comes straight from the
  public GitHub repo (hub/plan.json, hub/progress.json, recent commits), so it changes as
  WOLF is built, with no server running on this computer.
-->
<style>
  /* Layout: blueprint sheet; the wolf on the left two-thirds, a quiet status column on the right. */
  :root {
    --paper: #0b1d33;
    --grid: rgba(127, 179, 255, .07);
    --grid-strong: rgba(127, 179, 255, .13);
    --line: #7fb3ff;
    --ink: #e6f0ff;
    --muted: #8ea6c7;
    --accent: #5ee0c1;
    --warm: #ffb85c;
    --card: rgba(9, 24, 44, .72);
    --display: "Bahnschrift", "DIN Alternate", "Segoe UI", system-ui, sans-serif;
    --mono: "Cascadia Mono", "Consolas", ui-monospace, monospace;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background:
      linear-gradient(var(--grid-strong) 1px, transparent 1px) 0 0 / 120px 120px,
      linear-gradient(90deg, var(--grid-strong) 1px, transparent 1px) 0 0 / 120px 120px,
      linear-gradient(var(--grid) 1px, transparent 1px) 0 0 / 24px 24px,
      linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0 / 24px 24px,
      radial-gradient(ellipse at 35% 45%, #12325a 0%, var(--paper) 65%);
    color: var(--ink);
    font: 1.6vh/1.45 "Segoe UI", system-ui, sans-serif;
    overflow: hidden;
    display: grid;
    grid-template-columns: 2fr 1fr;
    gap: 3vw;
    padding: 5vh 4vw;
  }
  body.no-panel { grid-template-columns: 1fr; }
  body.no-panel aside { display: none; }
  @media (max-aspect-ratio: 1/1) { body { grid-template-columns: 1fr; grid-template-rows: 1.2fr 1fr; } }

  .stage { position: relative; display: grid; place-items: center; min-height: 0; }
  .stage svg { width: min(100%, 78vh); height: auto; overflow: visible; }
  .tri { stroke: var(--line); stroke-width: .35; stroke-linejoin: round; fill: transparent; transition: fill 1.2s, stroke-opacity 1.2s, opacity 1.2s; }
  .tri.todo { stroke-opacity: .35; stroke-dasharray: 1.6 1.4; }
  .tri.idea { stroke-opacity: .16; stroke-dasharray: .8 2; }
  .tri.done { fill: url(#doneFill); stroke-opacity: .9; }
  .tri.active { fill: var(--warm); fill-opacity: .25; stroke: var(--warm); animation: pulse 2.4s ease-in-out infinite; }
  .tri.fresh { animation: settle 3.5s ease-out 1; }
  @keyframes pulse { 50% { fill-opacity: .55; } }
  @keyframes settle { 0% { fill: #ffffff; } 100% { fill: url(#doneFill); } }
  .eye { fill: var(--warm); filter: url(#glow); }
  .label { position: absolute; left: 0; bottom: 0; font-family: var(--mono); color: var(--muted); font-size: 1.3vh; letter-spacing: .06em; }
  .title-block { position: absolute; left: 0; top: 0; }
  .title-block h1 { font-family: var(--display); font-weight: 600; font-size: 7vh; letter-spacing: .28em; margin: 0; line-height: 1; }
  .title-block p { margin: .6vh 0 0; color: var(--muted); font-family: var(--mono); font-size: 1.4vh; letter-spacing: .12em; text-transform: uppercase; }

  aside { display: flex; flex-direction: column; gap: 2.2vh; min-width: 0; align-self: center; }
  .card { background: var(--card); border: 1px solid rgba(127, 179, 255, .22); border-radius: 1.2vh; padding: 1.8vh 2vh; backdrop-filter: blur(2px); min-width: 0; }
  .eyebrow { font-family: var(--mono); font-size: 1.15vh; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-bottom: .8vh; }
  .big { font-family: var(--display); font-size: 4.4vh; line-height: 1; font-variant-numeric: tabular-nums; }
  .big small { font-size: 1.8vh; color: var(--muted); margin-left: .6vh; letter-spacing: .02em; }
  .bar { height: .7vh; border-radius: 1vh; background: rgba(127, 179, 255, .15); overflow: hidden; margin: 1.2vh 0 .9vh; }
  .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--line)); transition: width 1.5s ease; }
  .work-title { font-weight: 600; font-size: 1.9vh; }
  .muted { color: var(--muted); }
  ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: .9vh; }
  li { display: grid; grid-template-columns: 1fr auto; gap: 1vh; align-items: baseline; min-width: 0; }
  li span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  li time, .tag { font-family: var(--mono); font-size: 1.15vh; color: var(--muted); white-space: nowrap; }
  .tag.you { color: var(--warm); }
  li.new span:first-child { color: var(--accent); }
  li.new span:first-child::before { content: "new  "; font-family: var(--mono); font-size: 1.1vh; color: var(--accent); }
  footer { font-family: var(--mono); font-size: 1.1vh; color: var(--muted); letter-spacing: .05em; }
  .paused * { animation-play-state: paused !important; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
  <section class="stage" aria-label="WOLF, assembled from its production plan">
    <div class="title-block"><h1>WOLF</h1><p id="subtitle">Under construction</p></div>
    <svg id="wolf" viewBox="0 0 200 200" role="img" aria-label="Wolf blueprint">
      <defs>
        <linearGradient id="doneFill" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" style="stop-color: var(--accent)" stop-opacity=".85"/>
          <stop offset="1" stop-color="#3b7fd9" stop-opacity=".7"/>
        </linearGradient>
        <filter id="glow" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="1.4" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      </defs>
      <g id="tris"></g>
      <ellipse class="eye" cx="73" cy="99" rx="3" ry="1.7"/>
      <ellipse class="eye" cx="127" cy="99" rx="3" ry="1.7"/>
    </svg>
    <div class="label" id="sheet">SHEET 01 · WOLF · PLAN-DRIVEN ASSEMBLY</div>
  </section>

  <aside>
    <div class="card">
      <div class="eyebrow">Production plan</div>
      <div class="big" id="plan-count">--<small>items done</small></div>
      <div class="bar"><i id="plan-bar"></i></div>
      <div class="muted" id="plan-phase"></div>
    </div>
    <div class="card">
      <div class="eyebrow">Being built now</div>
      <div class="work-title" id="work-title">Waiting for data</div>
      <div class="bar"><i id="work-bar"></i></div>
      <div class="muted" id="work-now"></div>
    </div>
    <div class="card">
      <div class="eyebrow">Latest changes</div>
      <ul id="commits"><li><span class="muted">Loading…</span></li></ul>
    </div>
    <div class="card">
      <div class="eyebrow">Up next</div>
      <ul id="next"></ul>
    </div>
    <footer id="status">Connecting to GitHub…</footer>
  </aside>

<script>
"use strict";
/* ---------- settings (Wallpaper Engine properties override these) ---------- */
const cfg = { repo: "foxywox/PROJECT-WOLF", branch: "", refreshMinutes: 2, showPanel: true };

/* ---------- the wolf: a low-poly head, left half mirrored ---------- */
const V = { A: [40, 10], B: [70, 55], C: [30, 70], D: [100, 45], M: [100, 78], E: [74, 82], F: [58, 98], G: [24, 112],
            N: [88, 104], O: [100, 118], H: [44, 142], I: [80, 138], J: [100, 152], L: [72, 170], K: [100, 184] };
const LEFT = ["ABC", "CBE", "BDM", "BME", "CEF", "CFG", "EMN", "ENF", "MON", "FNI", "FIH", "FHG", "NOI", "OJI", "HIL", "IJL", "JKL"];
const mirror = ([x, y]) => [200 - x, y];
const TRIS = [];
for (const t of LEFT) {
  const pts = [...t].map((k) => V[k]);
  TRIS.push(pts, pts.map(mirror));
}
// Assemble from the ears down: sort by height, then from the outside in.
TRIS.sort((a, b) => {
  const cy = (p) => (p[0][1] + p[1][1] + p[2][1]) / 3, cx = (p) => Math.abs((p[0][0] + p[1][0] + p[2][0]) / 3 - 100);
  return cy(a) - cy(b) || cx(b) - cx(a);
});
const group = document.getElementById("tris");
const polys = TRIS.map((pts) => {
  const p = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
  p.setAttribute("points", pts.map((q) => q.join(",")).join(" "));
  p.setAttribute("class", "tri todo");
  group.appendChild(p);
  return p;
});

/* ---------- helpers ---------- */
const $ = (id) => document.getElementById(id);
const store = { get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
                set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch { /* fine */ } } };
function ago(t) {
  const m = Math.round((Date.now() - new Date(t).getTime()) / 60000);
  if (m < 1) return "just now";
  if (m < 60) return m + " min ago";
  if (m < 1440) return Math.round(m / 60) + " h ago";
  return Math.round(m / 1440) + " d ago";
}
function li(text, right, cls) {
  const el = document.createElement("li");
  if (cls) el.className = cls;
  const a = document.createElement("span"); a.textContent = text;
  const b = document.createElement(right && right.time ? "time" : "span");
  b.className = right && right.cls || "tag"; b.textContent = right ? right.text : "";
  el.append(a, b);
  return el;
}
async function getJSON(url) {
  const r = await fetch(url, { cache: "no-store" });
  if (!r.ok) throw new Error(r.status + " " + url.split("/").slice(-2).join("/"));
  return r.json();
}

/* ---------- rendering ---------- */
function renderPlan(plan) {
  const items = (plan.phases || []).flatMap((p) => (p.items || []).map((i) => ({ ...i, phase: p.name })));
  if (!items.length) return;
  const done = items.filter((i) => i.status === "done").length;
  $("plan-count").innerHTML = "";
  $("plan-count").append(`${done}/${items.length}`, Object.assign(document.createElement("small"), { textContent: "items done" }));
  $("plan-bar").style.width = (100 * done / items.length) + "%";
  const current = (plan.phases || []).find((p) => p.status === "active") || (plan.phases || []).find((p) => p.status === "next");
  $("plan-phase").textContent = current ? `Now: ${current.name.replace(/^\d+\.\s*/, "")}` : "All phases done";
  $("subtitle").textContent = done === items.length ? "Complete" : `${Math.round(100 * done / items.length)}% assembled`;

  // Each triangle belongs to one plan item, in plan order.
  const before = new Set(store.get("wolf.wp.doneTris") || []);
  const nowDone = [];
  polys.forEach((poly, t) => {
    // Mirrored halves sit next to each other after sorting, so pairs share an item: the wolf stays symmetric.
    const pairs = polys.length / 2;
    const item = items[Math.min(items.length - 1, Math.floor(Math.floor(t / 2) * items.length / pairs))];
    const state = item.status === "done" ? "done" : item.status === "active" ? "active" : item.status === "idea" ? "idea" : "todo";
    poly.setAttribute("class", "tri " + state + (state === "done" && before.size && !before.has(t) ? " fresh" : ""));
    if (state === "done") nowDone.push(t);
    const title = poly.querySelector("title") || poly.appendChild(document.createElementNS("http://www.w3.org/2000/svg", "title"));
    title.textContent = `${item.title} (${item.status})`;
  });
  store.set("wolf.wp.doneTris", nowDone);

  const next = items.filter((i) => i.status === "active" || i.status === "next").slice(0, 5);
  const ul = $("next"); ul.innerHTML = "";
  for (const i of next) ul.append(li(i.title, i.who === "human" ? { text: "needs you", cls: "tag you" } : { text: i.status === "active" ? "in progress" : "next" }));
  if (!next.length) ul.append(li("Nothing queued", null));
}

function renderProgress(p) {
  if (!p) return;
  const pct = Math.max(0, Math.min(100, Math.round(Number(p.percent) || 0)));
  const done = p.status === "done" || pct >= 100;
  $("work-title").textContent = done ? `Finished: ${p.title || "last build"}` : (p.title || "Current work");
  $("work-bar").style.width = pct + "%";
  $("work-now").textContent = (done ? "Waiting for the next build" : `${pct}% · ${p.current || "working"}`) + (p.updated ? ` · ${ago(p.updated)}` : "");
}

function renderCommits(commits) {
  const seen = store.get("wolf.wp.lastSha");
  const ul = $("commits"); ul.innerHTML = "";
  commits.slice(0, 6).forEach((c, idx) => {
    const msg = (c.commit && c.commit.message || "").split("\n")[0];
    const fresh = seen && idx === 0 && c.sha !== seen;
    ul.append(li(msg, { text: ago(c.commit.author.date), time: true }, fresh ? "new" : ""));
  });
  if (commits[0]) store.set("wolf.wp.lastSha", commits[0].sha);
}

/* ---------- data ---------- */
let branch = "", lastOk = 0, timer = null, paused = false;
async function refresh() {
  if (paused) return;
  try {
    if (!branch) branch = cfg.branch || (await getJSON(`https://api.github.com/repos/${cfg.repo}`)).default_branch;
    const raw = `https://raw.githubusercontent.com/${cfg.repo}/${encodeURIComponent(branch).replace(/%2F/g, "/")}/hub/`;
    const t = Date.now();
    const [plan, progress, commits] = await Promise.all([
      getJSON(raw + "plan.json?t=" + t),
      getJSON(raw + "progress.json?t=" + t).catch(() => null),
      getJSON(`https://api.github.com/repos/${cfg.repo}/commits?sha=${encodeURIComponent(branch)}&per_page=6`),
    ]);
    store.set("wolf.wp.cache", { plan, progress, commits });
    renderPlan(plan); renderProgress(progress); renderCommits(commits);
    lastOk = Date.now();
    $("status").textContent = `${cfg.repo} · ${branch} · checked just now`;
  } catch (e) {
    $("status").textContent = `Offline or GitHub busy (${e.message}). Showing the last saved view${lastOk ? ", checked " + ago(lastOk) : ""}.`;
  }
}
function schedule() {
  clearInterval(timer);
  timer = setInterval(refresh, Math.max(1, cfg.refreshMinutes) * 60000);
  setInterval(() => { if (lastOk) $("status").textContent = `${cfg.repo} · ${branch} · checked ${ago(lastOk)}`; }, 30000);
}

// Show the last saved view instantly, then fetch fresh data.
const cached = store.get("wolf.wp.cache");
if (cached) { renderPlan(cached.plan); renderProgress(cached.progress); renderCommits(cached.commits || []); }
refresh();
schedule();

/* ---------- Wallpaper Engine integration (ignored in a normal browser) ---------- */
function weColor(v) { const [r, g, b] = String(v).split(" ").map((n) => Math.round(Number(n) * 255)); return `rgb(${r}, ${g}, ${b})`; }
window.wallpaperPropertyListener = {
  applyUserProperties(p) {
    let reload = false;
    if (p.repo && p.repo.value && p.repo.value !== cfg.repo) { cfg.repo = p.repo.value.trim(); branch = ""; reload = true; }
    if (p.branch && p.branch.value !== undefined && p.branch.value !== cfg.branch) { cfg.branch = p.branch.value.trim(); branch = ""; reload = true; }
    if (p.refreshminutes) { cfg.refreshMinutes = Number(p.refreshminutes.value) || 2; schedule(); }
    if (p.showpanel) document.body.classList.toggle("no-panel", !p.showpanel.value);
    if (p.accentcolor) document.documentElement.style.setProperty("--accent", weColor(p.accentcolor.value));
    if (reload) refresh();
  },
  setPaused(isPaused) {
    paused = isPaused;
    document.body.classList.toggle("paused", isPaused);
    if (!isPaused) refresh();
  },
};
</script>
</body>
</html>
