[project]
name = "wolf-assistant"
version = "0.1.0"
description = "WOLF development assistant: a Claude-powered agent that analyzes and helps you work with PROJECT WOLF."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["anthropic>=2.6.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
wolf = "wolf_assistant.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["wolf_assistant"]
