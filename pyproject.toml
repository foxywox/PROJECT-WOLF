[project]
name = "wolf"
version = "0.1.0"
description = "WOLF: a personal AI assistant that learns along with you over time."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["anthropic>=2.6.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
wolf = "wolf.cli:main"
wolf-dev = "wolf_assistant.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["wolf", "wolf_assistant"]

[tool.setuptools.package-data]
wolf = ["web/*"]
